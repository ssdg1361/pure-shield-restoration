# Shared content for the tile ("board") layout: homepage + area/service pages.
steps:
  - name: "Detect"
    img: "/images/hero-5.jpg"
    alt: "Thermal imaging camera showing hidden moisture in a wall"
    text: "Thermal cameras and moisture meters find the water you can't see, so we fix the source and not just the stain."
  - name: "Contain"
    img: "/images/pompano-containment-2.jpg"
    alt: "Sealed containment barrier with filtered airflow in a Pompano Beach hallway"
    text: "Plastic walls and negative air pressure seal off the work area, so spores stay where they are."
  - name: "Remove"
    img: "/images/parkland-ceiling-mold-6.jpg"
    alt: "Removed ceiling board laid out showing the full extent of growth on the hidden side"
    text: "Damaged drywall, trim and flooring come out down to clean material, with HEPA scrubbers running the whole time."
  - name: "Dry"
    img: "/images/coral-springs-drying-2.jpg"
    alt: "Air mover with ducting drying tile flooring in a Coral Springs home"
    text: "Commercial air movers and dehumidifiers, checked every day until the meters read dry."
  - name: "Restore"
    img: "/images/delray-water-4.jpg"
    alt: "Restored kitchen after water damage repair in a Delray Beach condo"
    text: "A final clean and a walkthrough with you. Most homes take about 3 to 5 days, start to verified dry."
