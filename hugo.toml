baseURL = "https://pureshieldrestoration.com/"
languageCode = "en-us"
title = "Pure Shield Restoration | Mold & Water Damage Restoration | Boca Raton & South Florida"

[params]
  description = "Owner-operated mold and water damage restoration in Boca Raton and across Palm Beach & Broward. 24/7 response, honest pricing, insurance claims welcome. Call (954) 778-0925."
  phone = "(954) 778-0925"
  phoneRaw = "9547780925"
  location = "Boca Raton, FL"
  serviceArea = "Palm Beach & Broward"

[taxonomies]
  service = "services"
  area = "areas"
  tag = "tags"

[imaging]
  quality = 82

# Mount static/ into assets/ as well, so Hugo image processing can read the
# same files it publishes. Nothing moves and no /images/... URL changes.
# NOTE: declaring any mount replaces Hugo's defaults, so all of them are listed.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static"
    target = "assets"
