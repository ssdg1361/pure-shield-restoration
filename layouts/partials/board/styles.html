{{/* Tile ("board") layout styles, shared by the homepage and board area/service pages. */}}
<style>
/* ===================== homepage board ===================== */
.home{--gap:8px;--edge:12px;--row:96px;
  --paper2:#EAE3D3;          /* one tone step darker than the cream ground */
  --t-d:clamp(40px,4.6vw,66px);   /* display */
  --t-h:clamp(30px,3.4vw,50px);   /* section headings */
  --t-l:clamp(20px,1.7vw,24px);   /* lead / tile statements */
  --t-b:18px;                     /* body */
  --t-s:14px;                     /* small */
  color:var(--ink);font-size:var(--t-b);line-height:1.55;padding:0 var(--edge);
  display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(120px,12vw,180px)}
.home>*{min-width:0}
.home h1,.home h2,.home h3{color:inherit;letter-spacing:-.025em;line-height:1.04;font-weight:700;overflow-wrap:normal}
.home h2{font-size:var(--t-h)}
.home p{max-width:62ch}
.t{position:relative;margin:0;padding:24px;overflow:hidden;display:flex;flex-direction:column}
.t-paper{background:var(--paper)}
.t-paper2{background:var(--paper2)}
.t-navy{background:var(--navy);color:#fff}
.t-ink{background:var(--ink);color:#fff}
.t-accent{background:var(--water);color:#fff}
.t-green{background:var(--green-ink);color:#fff}
.t.t-photo{padding:0;background:var(--paper2)}
.t-photo img{width:100%;height:100%;object-fit:cover}
.t-say{font-family:var(--display);font-size:var(--t-l);font-weight:600;line-height:1.2;letter-spacing:-.01em}
.nw{white-space:nowrap}
.t-note{font-size:var(--t-s);margin-top:8px;opacity:.92}
.t-link{margin-top:auto;font-family:var(--display);font-weight:600;font-size:var(--t-s);
  text-decoration:underline;text-underline-offset:.25em;text-decoration-thickness:1px}

/* ---- hero ---- */
.b-hero{display:grid;gap:var(--gap);grid-template-columns:7fr 5fr;
  grid-template-rows:minmax(300px,1fr) minmax(260px,1fr);
  height:calc(100svh - var(--hdr-h) - var(--gap));min-height:640px;max-height:940px}
.h-title{justify-content:flex-end;padding:clamp(24px,3vw,40px)}
.h-title h1{font-size:var(--t-d);font-weight:800;max-width:13em}
.h-sub{font-size:var(--t-l);line-height:1.4;margin-top:clamp(20px,2.4vw,36px);max-width:38ch}
.h-ph1{grid-column:2;grid-row:1}
.h-ph2{grid-column:1;grid-row:2}
.h-pair{grid-column:2;grid-row:2;display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.h-call{justify-content:space-between}
.h-ph2 img{object-position:50% 40%}

/* ---- credentials mosaic ---- */
.mz{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--gap)}
.mz>*{aspect-ratio:1}
.mz-p{background:var(--mz) var(--x) var(--y)/600% 400% no-repeat}
.mz-t{padding:18px;display:flex;flex-direction:column;overflow:hidden}
.mz-t p{font-size:18px;line-height:1.35}
.mz-t b{display:block;font-family:var(--display);font-size:var(--t-l);line-height:1.15;margin-bottom:6px}
.mz-head{justify-content:flex-end}
.mz-head h2{font-size:var(--t-h)}
.mz-call{justify-content:flex-end}
.mz-img{display:none}

/* ---- picker ---- */
.pk-head,.st-intro,.ow-head{padding:0 24px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);align-items:end}
.pk-head h2,.st-intro h2,.ow-head h2{grid-column:1/7}
.pk-head p,.st-intro p,.ow-head p{grid-column:7/13;font-size:var(--t-l);line-height:1.4}
.pk{display:grid;grid-template-columns:minmax(240px,3fr) 9fr;gap:var(--gap);margin-top:56px}
.pk-tabs{display:none;flex-direction:column;gap:6px}
.js .pk-tabs{display:flex}
.pk-tab{all:unset;box-sizing:border-box;cursor:pointer;min-height:64px;padding:12px 18px;
  display:flex;align-items:center;background:var(--paper2);color:var(--ink);
  font-family:var(--display);font-weight:600;font-size:var(--t-b);line-height:1.25;
  transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.pk-short{display:none}
.pk-tab:hover{background:#DFD6C2}
.pk-tab[aria-selected="true"]{background:var(--ink);color:#fff}
.pk-tab:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.pk-panels{display:grid;gap:var(--gap)}
.js .pk-panel[data-off]{display:none}
.pk-panel{display:grid;grid-template-columns:5fr 7fr;gap:var(--gap);min-height:520px}
.pk-ph{position:relative;margin:0;background:var(--paper2);overflow:hidden;min-height:280px}
.pk-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pk-body{display:flex;flex-direction:column;gap:4px}
.pk-body h3{font-size:var(--t-l);background:var(--navy);color:#fff;padding:24px;line-height:1.2}
.pk-spot{font-weight:500}
.pk-bands{display:grid;gap:4px;margin:0}
.pk-bands div{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:20px 24px;background:var(--paper)}
.pk-bands div:nth-child(2){background:var(--paper2)}
.pk-bands dt{font-family:var(--display);font-weight:600;font-size:var(--t-s);padding-top:2px}
.pk-bands dd{margin:0;font-size:18px;line-height:1.45}
.pk-more{margin-top:auto;padding:20px 24px;background:var(--paper);font-family:var(--display);font-weight:600;
  text-decoration:underline;text-underline-offset:.25em;text-decoration-thickness:1px}
.pk-more:hover{background:var(--paper2)}
.pk-foot{margin-top:24px;padding:0 24px;font-size:var(--t-b)}
.pk-foot a{font-family:var(--display);font-weight:600;text-decoration:underline;text-underline-offset:.25em;margin-left:6px}

/* ---- process accordion ---- */
.st{display:flex;height:540px;margin-top:64px}
.st-p{position:relative;flex:1 1 0;min-width:0;color:#fff;overflow:hidden;
  transition:flex-grow 450ms var(--ease-in-out)}
.st-p[data-i="0"]{background:#0F2A45}.st-p[data-i="1"]{background:#15395B}
.st-p[data-i="2"]{background:#184A72}.st-p[data-i="3"]{background:#1A5884}
.st-p[data-i="4"]{background:#1B6799}
.st[data-n="6"] .st-p[data-i="0"]{background:#0F2A45}.st[data-n="6"] .st-p[data-i="1"]{background:#143656}
.st[data-n="6"] .st-p[data-i="2"]{background:#174366}.st[data-n="6"] .st-p[data-i="3"]{background:#195076}
.st[data-n="6"] .st-p[data-i="4"]{background:#1A5C88}.st[data-n="6"] .st-p[data-i="5"]{background:#1B6799}
.st-p.is-open{flex-grow:7.2}
.st-h{position:absolute;left:0;bottom:0;z-index:2}
.st-btn{all:unset;cursor:pointer;display:block;padding:24px;font-family:var(--display);font-weight:700;
  font-size:var(--t-l);letter-spacing:-.01em;writing-mode:vertical-rl;transform:rotate(180deg)}
.st-btn:focus-visible{outline:2px solid #fff;outline-offset:-6px}
.st-p.is-open .st-h{top:0;bottom:auto}
.st-p.is-open .st-h{right:50%}
.st-p.is-open .st-btn{writing-mode:horizontal-tb;transform:none;font-size:clamp(28px,2.6vw,40px);line-height:1.08;padding:28px 32px;cursor:default}
.st-body{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);opacity:0;visibility:hidden;
  transition:opacity 300ms var(--ease-out)}
.st-p.is-open .st-body{opacity:1;visibility:visible;transition-delay:200ms}
.st-body p{align-self:end;padding:32px;font-size:18px;line-height:1.5;max-width:36ch}
.st-body img{width:100%;height:100%;min-height:0;object-fit:cover}

/* ---- services mosaic ---- */
.sv{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:var(--row);gap:var(--gap)}
.sv .t{padding:24px}
.sv h3{font-size:var(--t-l);line-height:1.15}
.sv .t p{font-size:16px;line-height:1.45;margin-top:10px}
.sv a.t{transition:background-color var(--dur-fast) var(--ease-out)}
.sv-head{grid-column:1/7;grid-row:1/4;justify-content:flex-end}
.sv-head h2{max-width:12em}
.sv-head p{font-size:var(--t-l);line-height:1.4;margin-top:20px}
.sv-ph1{grid-column:7/13;grid-row:1/6}
.sv-a{grid-column:1/4;grid-row:4/6}.sv-b{grid-column:4/7;grid-row:4/6}
.sv-c{grid-column:1/4;grid-row:6/9}.sv-d{grid-column:4/7;grid-row:6/9}
.sv-ph2{grid-column:7/13;grid-row:6/11}
.sv-e{grid-column:1/4;grid-row:9/11}.sv-f{grid-column:4/7;grid-row:9/11}
.sv a.t-navy:hover,.sv a.t-ink:hover{background:var(--water-deep)}
.sv a.t-paper:hover,.sv a.t-paper2:hover{background:#DFD6C2}
.sv a.t::after{content:"\2192";margin-top:auto;font-family:var(--display);font-size:var(--t-l);line-height:1;
  transition:transform var(--dur-fast) var(--ease-out)}
.sv a.t:hover::after{transform:translateX(6px)}

/* ---- owners ---- */
.ow{display:grid;grid-template-columns:8fr 4fr;gap:16px;margin-top:72px;align-items:start}
.ow-ph{position:relative;margin:0;aspect-ratio:16/10;overflow:hidden;background:var(--paper2)}
.ow-ph img{width:100%;height:100%;object-fit:cover}
.ow-ph figcaption{position:absolute;top:0;right:0;width:340px;padding:20px;background:var(--paper);font-size:16px;line-height:1.45}
.ow-towns{padding:28px}
.ow-towns h3{font-size:var(--t-l);line-height:1.2;max-width:16em}
.ow-towns ul{list-style:none;margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:16px}
.ow-towns a{text-decoration:underline;text-underline-offset:.2em;text-decoration-thickness:1px;text-decoration-color:rgba(255,255,255,.55)}
.ow-towns a:hover{text-decoration-color:#fff}
.ow-facts{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px;margin:24px 0 0;padding:0 24px}
.ow-facts dt{font-size:var(--t-s)}
.ow-facts dd{margin:2px 0 0;font-family:var(--display);font-weight:600;font-size:18px}

/* ---- reviews ---- */
.rv{display:grid;grid-template-columns:5fr 7fr;min-height:62svh}
.rv-name{justify-content:space-between;padding:32px}
.rv-name h2{font-size:var(--t-h);max-width:8em}
.rv-who b{display:block;font-family:var(--display);font-size:18px;font-weight:600}
.rv-who span{font-size:16px;opacity:.9}
.rv-quote{padding:48px}
.rv-quote p{font-family:var(--display);font-weight:500;font-size:var(--t-l);line-height:1.3;
  letter-spacing:-.01em;max-width:34ch;text-indent:-.45em}
.rv-more{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-top:var(--gap)}
.rv-more .t{padding:32px;gap:20px}
.rv-more p{font-size:var(--t-l);line-height:1.4;text-indent:-.4em}
/* "5.0 on Google" links to the Google review page */
.g-rev{color:inherit;text-decoration:underline;text-decoration-color:var(--bright);
  text-decoration-thickness:.08em;text-underline-offset:.16em;transition:color .2s}
.g-rev:hover,.g-rev:focus-visible{color:var(--bright)}
.g-rev-arrow{display:inline-block;font-size:.62em;margin-left:.12em;vertical-align:.45em;color:var(--bright)}
.rv-more footer{margin-top:auto;font-size:16px}
.rv-more footer b{font-family:var(--display);font-weight:600}

/* ---- faq bands ---- */
.b-faq{margin:0 calc(var(--edge) * -1)}
.fq-head{background:var(--water);color:#fff;min-height:36svh;display:flex;align-items:flex-end;padding:40px calc(var(--edge) + 24px)}
.fq-head h2{font-size:clamp(44px,6.4vw,96px);font-weight:800;letter-spacing:-.035em}
.fq{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);
  padding:56px calc(var(--edge) + 24px);background:var(--paper)}
.fq:nth-child(odd){background:var(--paper2)}
.fq h3{grid-column:1/6;font-size:var(--t-l);line-height:1.2;max-width:18em}
.fq-q{all:unset;display:block;cursor:default}
.fq-a{grid-column:7/13}
.fq-a p{font-size:18px;line-height:1.55}
.home [id]{scroll-margin-top:calc(var(--hdr-h) + 8px)}

/* ---- contact ---- */
.b-contact{margin:0 calc(var(--edge) * -1);background:var(--navy);color:#fff;padding:48px 0 clamp(80px,9vw,120px)}
.ct-strip{overflow:hidden}
.ct-run{display:flex;gap:var(--gap);width:max-content;animation:ct-run 80s linear infinite}
.ct-run img{height:150px;width:auto;aspect-ratio:3/4;object-fit:cover}
.ct-run img:nth-child(3n+2){aspect-ratio:1}
.ct-run img:nth-child(3n){aspect-ratio:3/2}
@keyframes ct-run{to{transform:translateX(-50%)}}
.b-contact:hover .ct-run{animation-play-state:paused}
.ct-head,.ct-form{padding:0 calc(var(--edge) + 24px)}
.ct-head{margin-top:72px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);align-items:end}
.ct-head h2{grid-column:1/7;font-size:var(--t-h)}
.ct-head p{grid-column:7/13;font-size:var(--t-l);line-height:1.4}
.ct-phone{font-family:var(--display);font-weight:700;white-space:nowrap;text-decoration:underline;text-underline-offset:.2em;text-decoration-thickness:2px}
.ct-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);margin-top:40px}
.cell{display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:96px;padding:14px 18px;
  background:#1E4A72;font-family:var(--display);font-size:var(--t-s);font-weight:600;
  transition:background-color var(--dur-fast) var(--ease-out)}
.cell:focus-within{background:#275987}
.cell input,.cell select,.cell textarea{all:unset;box-sizing:border-box;width:100%;font-family:var(--body);font-size:18px;font-weight:400;color:#fff;min-height:32px}
.cell input::placeholder,.cell textarea::placeholder{color:#B9CCDC}
.cell select{cursor:pointer;appearance:auto}
.cell select option{color:var(--ink)}
.cell textarea{resize:none}
.cell-go{border:0;cursor:pointer;justify-content:center;align-items:center;background:#fff;color:var(--navy);
  font-size:var(--t-l);font-weight:700;text-align:center}
.cell-go:hover{background:var(--paper2)}
.cell-go:active{transform:scale(.99)}
.cell-go:disabled{opacity:.7;cursor:wait}
.cell:focus-within,.cell-go:focus-visible{outline:2px solid #fff;outline-offset:2px}
.form-msg{grid-column:1/-1;margin:8px 0 0;font-size:16px}
.form-msg.ok{color:#fff;font-weight:600}
.form-msg.err{color:#ffc9bd;font-weight:600}

/* ---- area + service pages ---- */
.h-title--term h1{font-size:clamp(30px,4.2vw,60px)}
/* interior hero: one tall picture leads; license + call sit under the headline */
.b-hero--term{grid-template-rows:minmax(320px,1.4fr) minmax(200px,.6fr)}
.b-hero--term .h-ph1{grid-column:2;grid-row:1/3}
.b-hero--term .h-pair{grid-column:1;grid-row:2}
.b-hero--term .h-call .t-say{font-size:clamp(24px,2.2vw,32px)}
.sv--long{grid-auto-rows:minmax(var(--row),auto)}
.jr{display:grid;gap:var(--gap);margin-top:56px}
.jr-row{min-height:440px}
.gd{display:grid;grid-template-columns:3fr 9fr;gap:var(--gap);margin-top:56px;align-items:start}
.gd-toc{position:sticky;top:calc(var(--hdr-h) + 16px);padding:24px}
.gd-toc-h{font-family:var(--display);font-weight:700;font-size:18px;margin-bottom:14px}
.gd-toc ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.gd-toc ul ul{display:none}
.gd-toc a{font-size:16px;line-height:1.35;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:.2em;
  transition:text-decoration-color var(--dur-fast) var(--ease-out)}
.gd-toc a:hover{text-decoration-color:currentColor}
.gd-body{background:var(--paper);padding:clamp(24px,4vw,64px);max-width:none;font-size:18px;color:var(--ink)}
.gd-body>*{max-width:68ch}
.gd-body h2{font-size:var(--t-l);margin:48px 0 14px;color:var(--navy)}
.gd-body h2:first-child{margin-top:0}
.gd-body h2[id]{scroll-margin-top:calc(var(--hdr-h) + 16px)}
.ww{display:grid;grid-template-columns:8fr 4fr;gap:var(--gap);margin-top:56px}
.ww-hoods{padding:32px}
.ww-hoods h3,.ww-near h3{font-size:var(--t-l)}
.ww-hoods ul{list-style:none;margin:24px 0 0;columns:3;column-gap:24px;font-size:18px;line-height:1.9}
.ww-zips{margin-top:auto;padding-top:28px;font-size:16px}
.ww-side{display:grid;gap:var(--gap);align-content:start}
.ww-near{padding:28px}
.ww-near ul{list-style:none;margin:16px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:16px}
.ww-near a,.mo-towns a{text-decoration:underline;text-underline-offset:.2em;text-decoration-thickness:1px}
.sg{list-style:none;margin:56px 0 0;padding:0 24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px 32px}
.sg h3{font-size:clamp(26px,2.4vw,34px);line-height:1.1}
.sg p{margin-top:12px;font-size:18px;line-height:1.5}
.mo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);margin-top:56px}
.mo .t{min-height:220px}
.mo h3{font-size:var(--t-l);line-height:1.15}
.mo .t p{font-size:16px;line-height:1.45;margin-top:10px}
.mo a.t{transition:background-color var(--dur-fast) var(--ease-out)}
.mo a.t::after{content:"\2192";margin-top:auto;padding-top:16px;font-family:var(--display);font-size:var(--t-l);line-height:1;
  transition:transform var(--dur-fast) var(--ease-out)}
.mo a.t:hover::after{transform:translateX(6px)}
.mo a.t-navy:hover,.mo a.t-ink:hover{background:var(--water-deep)}
.mo a.t-paper:hover,.mo a.t-paper2:hover{background:#DFD6C2}
.mo-towns{grid-column:1/-1;min-height:0 !important}
.mo-towns ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:16px;font-size:17px}
@media (max-width:1100px){.gd{grid-template-columns:1fr}.gd-toc{position:static}.gd-toc ul{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.b-hero--term .h-ph1{grid-column:1/-1;grid-row:auto}.b-hero--term .h-pair{grid-column:1/-1;grid-row:auto}.ww{grid-template-columns:1fr}.sg{grid-template-columns:1fr 1fr}.mo{grid-template-columns:1fr 1fr}.jr-row{min-height:0}}
@media (max-width:760px){
  .h-title.h-title--term h1{font-size:30px}
  .b-hero--term .h-call .t-say{font-size:17px}
  .gd-toc{display:none}
  .gd-body{padding:24px 18px}
  .ww-hoods{padding:24px 18px}.ww-hoods ul{columns:2;font-size:17px}
  .sg{grid-template-columns:1fr;gap:32px;padding:0 12px;margin-top:32px}
  .mo{grid-template-columns:1fr;margin-top:32px}.mo .t{min-height:0}
  .jr,.gd,.ww{margin-top:32px}
}

/* ---- entrances (content never depends on them) ---- */
@media (prefers-reduced-motion:no-preference){
  .js [data-rise]{opacity:0;transform:translateY(22px);transition:opacity 700ms var(--ease-out),transform 700ms var(--ease-out)}
  .js [data-rise].is-in{opacity:1;transform:none}
  .js [data-rise]:nth-child(2){transition-delay:80ms}
  .js .shutter{clip-path:inset(0 0 100% 0);transition:clip-path 1100ms var(--ease-in-out)}
  .js .shutter img{transform:scale(1.12);transition:transform 1500ms var(--ease-out)}
  .js .shutter.is-in{clip-path:inset(0)}
  .js .shutter.is-in img{transform:none}
  .js .reveal-tile{opacity:0;transform:translateY(18px);transition:opacity 450ms var(--ease-out),transform 450ms var(--ease-out)}
  .js .reveal-tile.is-in{opacity:1;transform:none}
}
@media (prefers-reduced-motion:reduce){.ct-run{animation:none}}

/* ---- tablet ---- */
@media (max-width:1100px){
  .pk{grid-template-columns:minmax(200px,1fr) 3fr}
  .pk-panel{grid-template-columns:1fr;min-height:0}
  .pk-ph{aspect-ratio:16/10}
  .ow{grid-template-columns:1fr}
  .ow-side{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .ow-facts{margin:0;align-content:start}
}
@media (max-width:900px){
  .b-hero{grid-template-columns:1fr 1fr;grid-template-rows:auto;height:auto;min-height:0;max-height:none}
  .h-title{grid-column:1/-1;min-height:34svh}
  .h-ph1{grid-column:1/-1;grid-row:auto;aspect-ratio:4/3}
  .h-pair{grid-column:1/-1;grid-row:auto}
  .h-pair>.t{min-height:180px}
  .h-pair .t-say{font-size:19px}
